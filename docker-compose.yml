services:
  redis:
    image: redis:alpine
    container_name: mealyummy_redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [mealyummy-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: mealyummy_backend
    env_file: [.env]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx640m -XX:+UseSerialGC"
    depends_on: [redis]
    restart: unless-stopped
    networks: [mealyummy-net]

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.frontend
    container_name: mealyummy_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot-www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks: [mealyummy-net]

networks:
  mealyummy-net:
    driver: bridge
